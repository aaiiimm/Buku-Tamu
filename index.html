<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SiTAMU-Q Sistem Buku Tamu Digital Dinkes Sultra</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .logo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-header img { height: 40px; width: auto; }
        .title-section { text-align: center; margin-bottom: 30px; }
        .title-section h1 { color: #4a7c44; font-size: 28px; font-style: italic; margin: 0; text-transform: uppercase; }
        form { margin-top: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="file"] { border: 1px dashed #4a7c44; background: #f9fff8; }
        
        /* Area Tanda Tangan */
        .signature-wrapper { 
            border: 2px solid #4a7c44; 
            background: #fff; 
            border-radius: 4px; 
            margin-bottom: 10px;
            height: 200px;
            position: relative;
            touch-action: none; /* Penting agar HP tidak scroll saat ttd */
        }
        canvas { 
            position: absolute;
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            cursor: crosshair; 
        }
        .btn-clear { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-bottom: 20px; }
        .btn-submit { width: 100%; background: #d9534f; color: white; border: none; padding: 15px; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-header">
        <div class="logo-left">
            <img src="germas.png" alt="Germas">
            <img src="sultra.png" alt="Sultra">
        </div>
        <div class="logo-right">
            <img src="akhlak.png" alt="AKHLAK">
            <img src="bangga.png" alt="Bangga">
        </div>
    </div>

    <div class="title-section">
        <h1>SiTAMU-Q <br>Sistem Buku Tamu Digital<br>Dinas Kesehatan PROV SULTRA</h1>
    </div>
    
    <form id="guestForm">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Nama Anda, contoh :Aim" required>

        <label>Asal Instansi</label>
        <input type="text" id="instansi" placeholder="Instansi, contoh BKD prov SULTRA" required>

        <label>Tujuan Kunjungan</label>
        <input type="text" id="tujuan" placeholder="Tujuan, contoh : Ketemu Ibu Sekdin" required>

        <label>No HP / WA</label>
        <input type="tel" id="hp" placeholder="08..." required>

        <label>Lampiran (Silahkan Upload jika membawa surat Tugas/Perintah)</label>
        <input type="file" id="fileInput" accept="image/*,application/pdf">

        <label>Tanda-Tangan</label>
        <div class="signature-wrapper">
            <canvas id="signature-pad"></canvas>
        </div>
        <button type="button" class="btn-clear" id="clear">Hapus Tanda Tangan</button>

        <button type="submit" id="submitBtn" class="btn-submit">Simpan Kehadiran</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwucaNtMf7Ph5pYH7-v_jRLBSDJ5u9O8HE6Qi1tShx3WAIvvl5Q8fDZWW1HjxTpFZ_t/exec";
    
    let signaturePad;
    const canvas = document.getElementById('signature-pad');

    // Fungsi Inisialisasi Pad
    function initSignature() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        
        signaturePad = new SignaturePad(canvas, {
            backgroundColor: 'rgb(255, 255, 255)',
            penColor: 'rgb(0, 0, 0)'
        });
    }

    // Jalankan dengan jeda sedikit agar layout selesai loading
    window.addEventListener("load", () => {
        setTimeout(initSignature, 500);
    });

    document.getElementById('clear').addEventListener('click', () => {
        signaturePad.clear();
    });
    document.getElementById('guestForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    if (signaturePad.isEmpty()) {
        alert("Silakan tanda tangan terlebih dahulu.");
        return;
    }

    const btn = document.getElementById('submitBtn');
    const fileInput = document.getElementById('fileInput');
    btn.disabled = true;
    btn.innerText = "Sedang Mengirim Data & File...";

    let fileData = null;
    let fileName = null;

    // --- PERBAIKAN PEMBACAAN FILE ---
    if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        // Membaca file dan menunggu sampai selesai
        fileData = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(e);
            reader.readAsDataURL(file);
        });
    }

    const data = {
        nama: document.getElementById('nama').value,
        instansi: document.getElementById('instansi').value,
        tujuan: document.getElementById('tujuan').value,
        hp: document.getElementById('hp').value,
        tandaTangan: signaturePad.toDataURL(),
        fileData: fileData, // Data file dikirim dalam format Base64
        fileName: fileName
    };

    // Mengirim ke Google Apps Script
    fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        if(result.result === "success") {
            alert("Berhasil! Data Anda Berhasil Tersimpan.");
            location.reload(); 
        } else {
            alert("Gagal: " + result.error);
            btn.disabled = false;
            btn.innerText = "Simpan Kehadiran";
        }
    })
    .catch(error => {
        // Fallback jika terjadi CORS issue tapi data biasanya tetap masuk
        alert("Terima kasih Ki Bapak/Ibu " + data.nama + ", data sedang diproses.");
        location.reload();
    });
});
</script>
</body>
</html>
