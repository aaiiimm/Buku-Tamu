<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital Kesehatan Prov Sultra</title>
    <script src="https://script.google.com/macros/s/AKfycbzRRbpj4DwyRaWYJ3kaw-3mBl1fRVeJ_vza0XoVH6V5tu3vIghNACIQucitThmBu6Cd/exec"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
        }
        .container { 
            max-width: 600px; 
            width: 100%;
            background: white; 
            padding: 40px 30px; 
            border-radius: 8px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        }
        
        .logo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .logo-left, .logo-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .logo-header img {
            height: 45px;
            width: auto;
        }

        .title-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .title-section h1 {
            color: #4a7c44; 
            font-size: 32px;
            font-style: italic;
            font-weight: 800;
            line-height: 1.1;
            margin: 0;
            text-transform: uppercase;
        }
        .welcome-text {
            text-align: center;
            color: #5f6368;
            font-size: 15px;
            line-height: 1.5;
            margin-top: 25px;
            padding: 0 20px;
        }

        form { margin-top: 30px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #333; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            background-color: #fff;
        }
        
        /* Style khusus untuk input file */
        input[type="file"] {
            padding: 8px;
            border: 1px dashed #4a7c44;
            background: #f9fff8;
        }

        .signature-wrapper { 
            border: 1px solid #ccc; 
            background: #fff; 
            border-radius: 4px; 
            margin-bottom: 10px; 
        }
        canvas { 
            width: 100%; 
            height: 180px; 
            cursor: crosshair; 
            touch-action: none; 
        }
        .btn-clear { 
            background: #6c757d; 
            color: white; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 13px; 
            margin-bottom: 25px;
        }
        
        .btn-submit { 
            width: 100%; 
            background: #d9534f; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 4px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            transition: 0.3s; 
        }
        .btn-submit:hover { background: #c9302c; }
        .btn-submit:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-header">
        <div class="logo-left">
            <img src="germas.png" alt="Logo Germas">
            <img src="sultra.png" alt="Logo Sultra">
        </div>
        <div class="logo-right">
            <img src="akhlak.png" alt="BerAKHLAK">
            <img src="bangga.png" alt="Bangga Melayani Bangsa">
        </div>
    </div>

    <div class="title-section">
        <h1>Buku Tamu<br>Dinas Kesehatan<br>Prov Sultra</h1>
        <p class="welcome-text">
            Silakan isi data Anda sebagai tamu yang berkunjung ke Dinas Kesehatan Provinsi Sultra. Terima kasih atas kunjungannya.
        </p>
    </div>
    
    <form id="guestForm">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Contoh: Budi Santoso" required>

        <label>Asal Instansi</label>
        <input type="text" id="instansi" placeholder="Contoh: Kemenkes RI" required>

        <label>Tujuan Kunjungan</label>
        <input type="text" id="tujuan" placeholder="Contoh: Koordinasi Program" required>

        <label>No HP / WA</label>
        <input type="tel" id="hp" placeholder="0812xxxx" required>

        <label>Lampiran File / Foto (Opsional)</label>
        <input type="file" id="fileInput" accept="image/*,application/pdf">

        <label>Tanda-Tangan / Paraf</label>
        <div class="signature-wrapper">
            <canvas id="signature-pad"></canvas>
        </div>
        <button type="button" class="btn-clear" id="clear">Hapus Tanda Tangan</button>

        <button type="submit" id="submitBtn" class="btn-submit">Simpan Kehadiran</button>
    </form>
</div>

<script>
    // GANTI URL DI BAWAH INI DENGAN LINK WEB APP BARU ANDA JIKA PERLU
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRRbpj4DwyRaWYJ3kaw-3mBl1fRVeJ_vza0XoVH6V5tu3vIghNACIQucitThmBu6Cd/exec";

    const canvas = document.getElementById('signature-pad');
    const signaturePad = new SignaturePad(canvas);
    const fileInput = document.getElementById('fileInput');

    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
    }
    window.onresize = resizeCanvas;
    resizeCanvas();

    document.getElementById('clear').addEventListener('click', () => {
        signaturePad.clear();
    });

    document.getElementById('guestForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (signaturePad.isEmpty()) {
            alert("Silakan bubuhkan tanda tangan terlebih dahulu.");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Sedang Mengirim...";

        let fileData = null;
        let fileName = null;

        // Logika membaca file jika ada
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            fileName = file.name;
            fileData = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        const data = {
            nama: document.getElementById('nama').value,
            instansi: document.getElementById('instansi').value,
            tujuan: document.getElementById('tujuan').value,
            hp: document.getElementById('hp').value,
            tandaTangan: signaturePad.toDataURL(),
            fileData: fileData,
            fileName: fileName
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(response => {
            alert("Terima kasih Bapak/Ibu " + data.nama + ", data Anda berhasil tersimpan!");
            document.getElementById('guestForm').reset();
            signaturePad.clear();
            btn.disabled = false;
            btn.innerText = "Simpan Kehadiran";
        })
        .catch(error => {
            alert("Terjadi kesalahan saat menyimpan data.");
            btn.disabled = false;
            btn.innerText = "Simpan Kehadiran";
        });
    });
</script>

</body>
</html>
